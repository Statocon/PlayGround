</style></head><body><div class="noise"></div><main id="app"></main><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
const app=document.querySelector('#app');const factions={Unaffiliated:'No banner. No promises. Every door stays open.',Pickers:'Scavengers who know every useful thing in a heap.',Hawkers:'Deal-makers. They trade in needs, never tokens.',Reapers:'The strong take what the weak cannot keep.',Delvers:'A sacred search for the way out. You do not leave.',Wardens:'Protection for hire. Their loyalties have a price.'};const origins={Drifter:'Quick hands, little trust.',Foundling:'Toughened by the lower runs.',Exile:'A hard lesson in being watched.'};
let s={name:'Marlow',origin:'Drifter',tone:0,build:0,scar:0,day:1,turn:0,loc:'The Heap',faction:'Unaffiliated',hp:82,hunger:77,thirst:72,stamina:82,inventory:{'Bent pipe':1,'Ration':1,'Scrap':2,'Cloth':1,'Dirty water':1},wounds:[],shelter:0,flags:{},logs:[],enemy:null,dead:false};const clamp=(v,a=0,b=100)=>Math.max(a,Math.min(b,v)),rand=(a,b)=>Math.floor(Math.random()*(b-a+1));function log(text,tag=''){s.logs.unshift({text,tag});s.logs=s.logs.slice(0,7)}function notify(text){const n=document.createElement('div');n.className='toast';n.textContent=text;document.body.append(n);setTimeout(()=>n.remove(),2400)}function inventoryCount(item){return s.inventory[item]||0}function add(item,n=1){s.inventory[item]=(s.inventory[item]||0)+n}
const locations={"The Heap":{desc:'A mountain of discarded lives beneath the city.',threat:' scavenger tracks • low light',x:'07° / 41°'},"Dripline":{desc:'Water ticks down through a ceiling that remembers rain.',threat:' stagnant pools • echoing steps',x:'12° / 08°'},"Molt Warrens":{desc:'Warm tunnels webbed with shed skins and clicking things.',threat:' vermin sign • close quarters',x:'31° / 16°'},"Old Lift":{desc:'A dead elevator shaft descends into blackness.',threat:' unstable ledges • bad air',x:'19° / 52°'}};
const itemInfo={Ration:'Food', 'Dirty water':'Water', 'Clean water':'Water', Scrap:'Material',Cloth:'Material','Bent pipe':'Weapon',Knife:'Weapon','Bug meat':'Food','Rat meat':'Food',Bandage:'Medicine',Filter:'Material', 'Wire spool':'Material'};
let modal=null,renderer,scene,camera,clock,personGroup,sceneObjects=[];
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function start(){s.name=(document.querySelector('#nameInput')?.value||'Marlow').trim().slice(0,18)||'Marlow';renderGame();initThree('#scene-canvas');log(`${s.name} wakes beneath the city. The air tastes of rust.`);notify('No way back up. Find water.');}
function renderCreator(){app.innerHTML=`<section id="creator"><div class="topline"><div class="brand">CRAG / <b>FIELD NOTES</b></div><div class="eyebrow">A survival story · cycle 01</div></div><div class="creator-grid"><div class="create-copy"><div class="eyebrow">You have been here before. Not like this.</div><h1 class="title">Beneath<br>the <span>Utopia</span></h1><p class="intro">Upstairs, the city calls itself perfect. Down here, everything useful has already belonged to someone. Make a life from what it left behind.</p><div class="section-label">01 / Name your survivor</div><input id="nameInput" class="field" maxlength="18" value="Marlow" aria-label="Survivor name"><div class="section-label">02 / Choose an origin</div><div class="origin-grid">${Object.entries(origins).map(([k,v])=>`<button class="origin ${k===s.origin?'active':''}" data-origin="${k}"><strong>${k}</strong><small>${v}</small></button>`).join('')}</div><div class="section-label">03 / Shape & history</div><div class="appearance"><div class="slider-row"><label>Build <span id="buildVal">Balanced</span></label><input id="build" type="range" min="0" max="2" value="${s.build}"></div><div class="slider-row"><label>Complexion <span id="toneVal">${['Pale','Olive','Deep'][s.tone]}</span></label><input id="tone" type="range" min="0" max="2" value="${s.tone}"></div></div><div class="section-label">A vow is not a plan</div><p class="creator-note">The Delvers believe there is a way out. Their vow forbids leaving. You may join them, but the promise is permanent.</p><div class="create-foot"><button id="begin" class="btn primary">Enter the Crag →</button><span class="creator-note">No currency. No easy choices.</span></div></div><div class="model-wrap"><canvas id="creator-canvas"></canvas><div class="model-caption"><span>SUBJECT / 001</span><span id="modelOrigin">DRIFTER</span></div><div class="model-mark">THE CITY DOES NOT<br>LOOK DOWN.</div></div></div></section>`;
app.querySelectorAll('[data-origin]').forEach(b=>b.onclick=()=>{s.origin=b.dataset.origin;app.querySelectorAll('[data-origin]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#modelOrigin').textContent=s.origin.toUpperCase()});for(const id of ['build','tone'])document.querySelector('#'+id).oninput=e=>{s[id]=+e.target.value;const labels=id==='build'?['Lean','Balanced','Sturdy']:['Pale','Olive','Deep'];document.querySelector('#'+id+'Val').textContent=labels[s[id]];updatePerson()};document.querySelector('#begin').onclick=start;initThree('#creator-canvas',true)}
function meter(label,val,color){return `<div class="meter"><div class="meter-label"><span>${label}</span><b>${Math.round(val)}%</b></div><div class="meter-track"><div class="meter-fill" style="width:${clamp(val)}%;background:${color}"></div></div></div>`}
function renderGame(){let loc=locations[s.loc];app.innerHTML=`<section id="game"><header class="game-header"><div class="game-title">BENEATH <em>THE UTOPIA</em></div><div class="header-right"><span>DAY ${s.day} · TURN ${s.turn}</span><span>⟡ ${esc(s.faction.toUpperCase())}</span><button class="btn" id="helpBtn">FIELD GUIDE</button></div></header><div class="game-grid"><div class="main-column"><div class="scene"><canvas id="scene-canvas"></canvas><div class="scene-head"><div class="eyebrow">LOWER CITY / ${String(s.day).padStart(2,'0')}</div><h2>${esc(s.loc)}</h2><p>${loc.desc}</p></div><div class="scene-coords">CRAG SECTOR ${loc.x}<br>DEPTH 4,208 M</div><div class="scene-bottom"><div class="threat">⚠${loc.threat}</div><div class="location-buttons">${Object.keys(locations).map(k=>`<button class="${s.loc===k?'active':''}" data-loc="${k}">${k}</button>`).join('')}</div></div></div><div class="action-grid">${[['scavenge','Scavenge','Search the debris for useful things.','⌕'],['hunt','Hunt vermin','Try to catch rats or edible bugs.','⌁'],['water','Find water','Collect or make water safe.','◌'],['shelter','Build shelter','Use materials to make a safer place.','⌂'],['rest','Catch your breath','Recover stamina; hunger advances.','Ⅱ'],['hide','Keep hidden','Avoid attention and steady your nerves.','◒'],['people','Approach survivor','Talk, bargain, or make trouble.','♧'],['inventory','Inventory','Check your belongings and injuries.','▤']].map(([id,title,sub,icon])=>`<button class="action" data-action="${id}"><span class="icon">${icon}</span><strong>${title}</strong><small>${sub}</small></button>`).join('')}</div><div class="event-log"><div class="log-title"><span>FIELD NOTES</span><span>LAST ${s.logs.length} EVENTS</span></div><div id="logList">${s.logs.map(x=>`<div class="logline"><b>›</b> ${esc(x.text)}</div>`).join('')||'<div class="logline">› Your story starts here.</div>'}</div></div></div><aside class="sidebar"><div class="sidepanel panel"><div class="portrait-row"><div class="avatar">${esc(s.name.slice(0,1).toUpperCase())}</div><div><div class="eyebrow">${esc(s.origin)} / SURVIVOR</div><div class="person-name">${esc(s.name)}</div><div class="person-origin">${esc(s.faction)}</div></div></div><div class="meters">${meter('Health',s.hp,'#cf7968')}${meter('Hunger',s.hunger,'#d8b579')}${meter('Thirst',s.thirst,'#85a9a0')}${meter('Stamina',s.stamina,'#bacd81')}</div><div class="wound-row ${s.wounds.length?'':'ok'}">${s.wounds.length?'INJURY · '+s.wounds.map(esc).join(', '):'NO OPEN WOUNDS'}</div></div><div class="sidepanel"><div class="side-heading"><span>CARRYING</span><span>${Object.values(s.inventory).reduce((a,b)=>a+b,0)} ITEMS</span></div><div class="inventory-list">${Object.entries(s.inventory).filter(x=>x[1]>0).map(([k,n])=>`<div class="item-chip">${esc(k)} <b>×${n}</b></div>`).join('')||'<div class="creator-note">Nothing worth keeping.</div>'}</div></div><div class="sidepanel"><div class="side-heading">THE SIX GROUPS</div>${Object.entries(factions).map(([k,v])=>`<div class="faction ${s.faction===k?'':'faction-copy'}">${k}</div>`).join('')}</div><button id="restart" class="btn">Abandon this run</button></aside></div></section>`;
app.querySelectorAll('[data-loc]').forEach(b=>b.onclick=()=>{s.loc=b.dataset.loc;advance(1);renderGame();initThree('#scene-canvas')});app.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>action(b.dataset.action));document.querySelector('#helpBtn').onclick=()=>openGuide();document.querySelector('#restart').onclick=()=>{if(confirm('Leave this run and create a new survivor?')){s={...s,name:'Marlow',origin:'Drifter',tone:0,build:0,day:1,turn:0,loc:'The Heap',faction:'Unaffiliated',hp:82,hunger:77,thirst:72,stamina:82,inventory:{'Bent pipe':1,Ration:1,Scrap:2,Cloth:1,'Dirty water':1},wounds:[],shelter:0,flags:{},logs:[],enemy:null,dead:false};renderCreator()}};}
function advance(n=1){for(let i=0;i<n;i++){s.turn++;s.hunger=clamp(s.hunger-4);s.thirst=clamp(s.thirst-6);s.stamina=clamp(s.stamina-3);if(s.turn%7===0)s.day++;if(s.hunger===0)s.hp-=3;if(s.thirst===0)s.hp-=6;if(s.hp<=0){s.hp=0;s.dead=true;ending('The Crag keeps another name','Hunger and thirst finally took what the city started. The tunnels do not remember you.')}}}
function refresh(){renderGame();initThree('#scene-canvas')}
function toastLog(text,tag=''){log(text,tag);notify(text);if(!s.dead)refresh()}
function spend(item,n=1){if(inventoryCount(item)<n)return false;s.inventory[item]-=n;return true}
function action(which){if(s.dead)return;const cost={scavenge:8,hunt:12,water:8,shelter:7,rest:0,hide:5,people:6,inventory:0}[which]||0;if(s.stamina<cost){notify('Too exhausted. Rest first.');return}if(which==='people'){advance(1);openPeople();return}if(which==='inventory'){openInventory();return}advance(1);s.stamina=clamp(s.stamina-cost+ (which==='rest'?25:0));if(s.dead)return;
if(which==='scavenge'){const rolls=[['Scrap',2],['Cloth',1],['Wire spool',1],['Ration',1],['Bandage',1],['Bent pipe',1]];let [item,n]=rolls[rand(0,rolls.length-1)];if(s.loc==='The Heap'&&Math.random()<.48){add(item,n);toastLog(`You pulled ${n>1?n+' ':''}${item} from the Heap.`,'good')}else if(Math.random()<.62){add(item,n);toastLog(`You found ${item}. Something else was looking.`,'good')}else startCombat('Heap lurker')}else if(which==='hunt'){if(Math.random()<.62){let item=Math.random()<.6?'Rat meat':'Bug meat';add(item,1);s.hunger=clamp(s.hunger+12);toastLog(`You caught ${item.toLowerCase()}. Raw, but edible.`,'good')}else startCombat('Tunnel rat')}else if(which==='water'){if(s.loc==='Dripline'&&Math.random()<.75){add('Dirty water',2);toastLog('You filled two bottles from the seep. Boil it before drinking.','good')}else if(inventoryCount('Dirty water')&&inventoryCount('Filter')){spend('Dirty water');spend('Filter');add('Clean water');toastLog('You filtered a bottle of clean water.','good')}else if(Math.random()<.4){add('Dirty water');toastLog('A small catch of dirty water. Better than nothing.','good')}else toastLog('Only rust-colored puddles. You need a filter or a safer source.')}else if(which==='shelter'){if(s.shelter){s.stamina=clamp(s.stamina+8);toastLog('You reinforce your shelter. It will soften the next blow.','good')}else if(spend('Scrap',2)&&spend('Cloth')){s.shelter=1;toastLog('You made a low shelter from scrap and cloth. It is not home, but it is yours.','good')}else toastLog('You need 2 Scrap and 1 Cloth to build a shelter.')}else if(which==='rest'){s.stamina=clamp(s.stamina+27);if(s.shelter){s.hp=clamp(s.hp+5);toastLog('You rest beneath your shelter. The roof holds.','good')}else if(Math.random()<.28){s.hp=clamp(s.hp-8);toastLog('You wake to a boot in your ribs. Never sleep unguarded.','bad')}else toastLog('You rest with one eye open. Stamina recovered.')}else if(which==='hide'){s.stamina=clamp(s.stamina+4);if(Math.random()<.6){toastLog('You stay out of sight. Footsteps pass without stopping.','good')}else {s.hp=clamp(s.hp-4);toastLog('A Reaper spots you in the shadows. You scramble away, bruised.','bad')}}}
function openPeople(){const characters=[{name:'Iona, Picker',group:'Pickers',line:'The Heap is alive. Bring me wire and cloth; I can make something useful.'},{name:'Vell, Hawker',group:'Hawkers',line:'No tokens here. Trade a ration for a bandage, or two scrap for a clean bottle. Weapons cost dearly.'},{name:'Marek, Reaper',group:'Reapers',line:'Strong keep what they can hold. A pipe buys respect. Or a fight.'},{name:'Sister Vale, Delver',group:'Delvers',line:'We search for the old ascent. Our vow is absolute: no Delver leaves.'},{name:'Orr, Warden',group:'Wardens',line:'Pay in supplies, not promises. I can watch your back—for a ration.'},{name:'Nim, unaffiliated',group:'Unaffiliated',line:'Nobody owns me. Share a little water and I might share a secret.'}];let c=characters.find(x=>x.group===s.faction)||characters[rand(0,characters.length-1)];modal=`<div class="eyebrow">A PERSON IN THE DARK</div><h2>${c.name}</h2><p class="dialogue">“${c.line}”</p><div class="choices"><button class="choice" data-choice="trade"><strong>Ask what they need</strong><small>Trade goods for goods. There is no currency.</small></button><button class="choice" data-choice="join"><strong>Ask about ${c.group}</strong><small>Learn their terms and decide where you stand.</small></button><button class="choice" data-choice="fight"><strong>Make a threat</strong><small>Could become a turn-based fight.</small></button><button class="choice" data-choice="leave"><strong>Leave quietly</strong><small>Keep your hands to yourself.</small></button></div>`;showModal();document.querySelector('[data-choice="trade"]').onclick=()=>openTrade(c);document.querySelector('[data-choice="join"]').onclick=()=>joinFaction(c);document.querySelector('[data-choice="fight"]').onclick=()=>{closeModal();startCombat(c.name)};document.querySelector('[data-choice="leave"]').onclick=closeModal}
function joinFaction(c){if(c.group==='Delvers'){modal=`<div class="eyebrow">A PERMANENT VOW</div><h2>The Delver oath</h2><p>“We do not leave until all can leave.” Joining binds you to the search. Even if you find the ascent, you will not take it alone—and the vow cannot be broken.</p><div class="choices"><button class="choice" id="vow"><strong>Swear the vow</strong><small>Become a Delver. This cannot be undone.</small></button><button class="choice" id="noVow"><strong>Not yet</strong><small>Keep your current allegiance.</small></button></div>`;showModal();document.querySelector('#vow').onclick=()=>{s.faction='Delvers';s.flags.delverVow=true;closeModal();toastLog('You swore the Delver vow. There is no leaving it.','good')};document.querySelector('#noVow').onclick=()=>{closeModal();openPeople()};return}if(c.group==='Reapers'&&!inventoryCount('Bent pipe')&&!inventoryCount('Knife')){modal=`<div class="eyebrow">THE REAPERS</div><h2>Prove you can keep it</h2><p>They do not accept a promise. Bring a weapon, then return to talk. Their protection is another kind of danger.</p><button class="btn" id="back">Back</button>`;showModal();document.querySelector('#back').onclick=closeModal;return}s.faction=c.group;closeModal();toastLog(`You are now recognized among the ${c.group}. Allegiance brings company, not safety.`,'good')}
function openTrade(c){let html=`<div class="eyebrow">BARTER / GOODS ONLY</div><h2>${c.group} exchange</h2>`;let offers=[];if(c.group==='Hawkers')offers=[['Ration','Bandage','Weapons cost at least three useful goods.'],['Scrap','Clean water','Two scrap for one clean bottle.'],['Cloth','Filter','Trade cloth for a filter.']];else if(c.group==='Pickers')offers=[['Wire spool','Knife','A carefully made blade.'],['Cloth','Bandage','One cloth for one bandage.']];else if(c.group==='Wardens')offers=[['Ration','Protection','A Warden watches you for a day.']];else offers=[['Rat meat','Scrap','Food for building material.'],['Dirty water','Cloth','A simple exchange.']];html+=`<div class="choices">${offers.map((o,i)=>`<button class="choice" data-offer="${i}"><strong>Give ${o[0]} → receive ${o[1]}</strong><small>${o[2]} · You have ${inventoryCount(o[0])} ${o[0]}.</small></button>`).join('')}<button class="choice" id="tradeBack"><strong>Back</strong><small>Return to the conversation.</small></button></div>`;modal=html;showModal();document.querySelectorAll('[data-offer]').forEach(b=>b.onclick=()=>{let [give,get]=offers[+b.dataset.offer];if(!spend(give)){notify(`You do not have ${give}.`);return}if(get==='Protection'){s.flags.wardenUntil=s.day+1;closeModal();toastLog('The Warden takes your ration and promises to watch the next stretch.','good');return}add(get);closeModal();toastLog(`Bartered ${give} for ${get}. No tokens changed hands.`,'good')});document.querySelector('#tradeBack').onclick=()=>{closeModal();openPeople()}}
function openInventory(){modal=`<div class="eyebrow">WHAT YOU CARRY</div><h2>Inventory & injuries</h2><p>${Object.entries(s.inventory).filter(x=>x[1]>0).map(([k,n])=>`${esc(k)} ×${n}`).join(' · ')||'Nothing'}.</p><p>${s.wounds.length?'Wounds: '+s.wounds.map(esc).join(', '):'No injuries.'}</p><div class="choices"><button class="choice" id="eat"><strong>Eat a ration or meat</strong><small>Recover hunger. Food can be raw; raw food is risky.</small></button><button class="choice" id="drink"><strong>Drink water</strong><small>Clean water is safest. Dirty water may make you sick.</small></button><button class="choice" id="bandage"><strong>Use a bandage</strong><small>Heal an open wound and restore health.</small></button><button class="choice" id="closeInv"><strong>Close</strong></button></div>`;showModal();document.querySelector('#eat').onclick=()=>{let food=['Ration','Rat meat','Bug meat'].find(x=>inventoryCount(x));if(!food){notify('No food to eat.');return}spend(food);s.hunger=clamp(s.hunger+(food==='Ration'?35:22));if(food!=='Ration'&&Math.random()<.2){s.hp=clamp(s.hp-7);s.wounds.push('stomach sickness')}closeModal();toastLog(`You ate ${food.toLowerCase()}.`,'good')};document.querySelector('#drink').onclick=()=>{let water=['Clean water','Dirty water'].find(x=>inventoryCount(x));if(!water){notify('No water to drink.');return}spend(water);s.thirst=clamp(s.thirst+(water==='Clean water'?38:24));if(water==='Dirty water'&&Math.random()<.3){s.hp=clamp(s.hp-6);s.wounds.push('fever')}closeModal();toastLog(`You drank ${water.toLowerCase()}.`,'good')};document.querySelector('#bandage').onclick=()=>{if(!spend('Bandage')){notify('You have no bandage.');return}if(s.wounds.length)s.wounds.shift();s.hp=clamp(s.hp+22);closeModal();toastLog('You bound your injury and caught your breath.','good')};document.querySelector('#closeInv').onclick=closeModal}
function startCombat(name){s.enemy={name,hp:44,turn:0};modal=`<div class="eyebrow">HOSTILE ENCOUNTER</div><h2>${esc(name)}</h2><div class="combat-top"><span>YOU · ${s.name}</span><span>OPPONENT · ${esc(name)}</span></div><div class="combat-bars">${meter('Your health',s.hp,'#cf7968')}${meter('Threat',s.enemy.hp,'#bb714a')}</div><p class="dialogue">The tunnel narrows. There is still time to choose what kind of person you are.</p><div class="combat-actions"><button class="combat-action" data-fight="strike"><b>Strike</b><small>Use a weapon if you have one.</small></button><button class="combat-action" data-fight="talk"><b>Talk</b><small>Offer a way out.</small></button><button class="combat-action" data-fight="flee"><b>Flee</b><small>Leave your pride behind.</small></button><button class="combat-action" data-fight="guard"><b>Guard</b><small>Reduce the next blow.</small></button></div>`;showModal();document.querySelectorAll('[data-fight]').forEach(b=>b.onclick=()=>combatTurn(b.dataset.fight))}
function combatTurn(choice){if(!s.enemy)return;if(choice==='talk'&&Math.random()<.48){let n=s.enemy.name; s.enemy=null;closeModal();toastLog(`${n} lowers their guard. You both leave breathing.`,'good');return}if(choice==='flee'&&Math.random()<.64){s.enemy=null;closeModal();toastLog('You escape into the dark, bruised but alive.','good');return}let damage=choice==='strike'?(inventoryCount('Bent pipe')||inventoryCount('Knife')?22:9):0;if(choice==='strike')s.enemy.hp-=damage;let guarded=choice==='guard';if(s.enemy.hp<=0){let n=s.enemy.name;s.enemy=null;s.stamina=clamp(s.stamina-8);closeModal();toastLog(`You survived the fight with ${n}. Your hands are still shaking.`,'good');return}let hit=guarded?rand(2,7):rand(7,17);if(s.shelter){hit=Math.max(1,hit-5);s.shelter=0}if(s.flags.wardenUntil>=s.day)hit=Math.max(0,hit-4);s.hp=clamp(s.hp-hit);s.stamina=clamp(s.stamina-8);s.enemy.turn++;if(s.hp<=0){s.enemy=null;closeModal();ending('The Crag keeps another name','Your body gives out in the dark. Nobody hears the last breath.');return}if(Math.random()<.18){let w=['split lip','bruised ribs','cut forearm'][rand(0,2)];if(!s.wounds.includes(w))s.wounds.push(w)}let n=s.enemy.name;modal=`<div class="eyebrow">THE FIGHT CONTINUES</div><h2>${esc(n)}</h2><div class="combat-top"><span>YOU · ${s.hp} HEALTH</span><span>THREAT · ${Math.max(0,s.enemy.hp)} HEALTH</span></div><p class="dialogue">${choice==='talk'?'Your words are swallowed by the tunnel.':choice==='flee'?'They cut off the escape.':choice==='guard'?'You weather the blow behind your guard.':'You strike; they answer in kind.'} You take ${hit} damage.</p><div class="combat-actions"><button class="combat-action" data-fight="strike"><b>Strike</b><small>Attack again</small></button><button class="combat-action" data-fight="talk"><b>Talk</b><small>Try to end this</small></button><button class="combat-action" data-fight="flee"><b>Flee</b><small>Look for an opening</small></button><button class="combat-action" data-fight="guard"><b>Guard</b><small>Brace for impact</small></button></div>`;showModal();document.querySelectorAll('[data-fight]').forEach(b=>b.onclick=()=>combatTurn(b.dataset.fight))}
function showModal(){document.querySelector('.modal-backdrop')?.remove();const d=document.createElement('div');d.className='modal-backdrop';d.innerHTML=`<div class="modal">${modal}</div>`;d.onclick=e=>{if(e.target===d)closeModal()};document.body.append(d)}function closeModal(){document.querySelector('.modal-backdrop')?.remove();modal=null}
function openGuide(){modal=`<div class="eyebrow">FIELD GUIDE / FIRST CYCLE</div><h2>Survive the Crag</h2><p>Every action advances time. Hunger and thirst fall; stamina fuels hard work. At zero, health drains. Use <b>Inventory</b> to eat, drink, or treat injuries. The Heap is safer to scavenge; the Dripline is the best water source. Build a shelter from two scrap and cloth, then rest.</p><p>Talk to survivors to trade goods. Hawkers exchange goods for goods—never currency. Weapons are scarce and costly. Combat is turn-based: strike, talk, flee, or guard. Factions remember you. The Delver vow is permanent.</p><div class="choices"><button class="choice" id="guideClose"><strong>Understood</strong><small>Keep moving.</small></button></div>`;showModal();document.querySelector('#guideClose').onclick=closeModal}
function ending(title,text){document.querySelector('.ending')?.remove();const e=document.createElement('div');e.className='ending';e.innerHTML=`<div><div class="eyebrow">BENEATH THE UTOPIA</div><h1>${title}</h1><p>${text}</p><button class="btn primary" id="again">Begin again</button></div>`;document.body.append(e);document.querySelector('#again').onclick=()=>location.reload()}
function updatePerson(){if(!personGroup)return;let skin=['#d0a990','#a8795c','#68483c'][s.tone];personGroup.traverse(o=>{if(o.userData.skin)o.material.color.set(skin);if(o.userData.build){let x=[.82,1,1.22][s.build];o.scale.x=x;o.scale.z=x}})}
function initThree(selector,creator=false){const canvas=document.querySelector(selector);if(!canvas)return;try{if(renderer){renderer.dispose();renderer=null}personGroup=null;renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(canvas.clientWidth,canvas.clientHeight,false);renderer.shadowMap.enabled=true;scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(38,canvas.clientWidth/canvas.clientHeight,.1,100);camera.position.set(0,1.5,creator?5.7:8);scene.add(new THREE.HemisphereLight(0xbab9a7,0x211c16,2));let key=new THREE.DirectionalLight(0xf1d3a8,3);key.position.set(-3,6,5);scene.add(key);
if(creator){scene.background=new THREE.Color('#171915');let floor=new THREE.Mesh(new THREE.CylinderGeometry(2.4,2.4,.15,32),new THREE.MeshStandardMaterial({color:'#3a382e',roughness:1}));floor.position.y=-1.35;scene.add(floor);personGroup=new THREE.Group();scene.add(personGroup);const mat=(color,roughness=.85)=>new THREE.MeshStandardMaterial({color,roughness});function part(g,m,pos,skin=false,build=false){let o=new THREE.Mesh(g,m);o.position.set(...pos);o.castShadow=true;if(skin)o.userData.skin=true;if(build)o.userData.build=true;personGroup.add(o);return o}let skinmat=mat(['#d0a990','#a8795c','#68483c'][s.tone]);part(new THREE.SphereGeometry(.31,18,14),skinmat,[0,1.08,0],true);part(new THREE.CylinderGeometry(.13,.18,.72,12),mat('#4b493c'),[0,.49,0],false,true);part(new THREE.CylinderGeometry(.105,.11,.44,10),skinmat,[0,.02,0],true);for(let side of [-1,1]){part(new THREE.CylinderGeometry(.075,.085,.58,9),mat('#484438'),[side*.12,-.38,0],false,true);part(new THREE.CylinderGeometry(.07,.08,.56,9),mat('#6a5947'),[side*.24,.48,0],false,true);part(new THREE.SphereGeometry(.09,10,8),skinmat,[side*.25,.16,0],true)}part(new THREE.BoxGeometry(.52,.12,.32),mat('#776247'),[0,-.74,.06]);part(new THREE.BoxGeometry(.06,.68,.05),mat('#22221d'),[0,.42,.18]);let hair=part(new THREE.SphereGeometry(.32,14,9,0,Math.PI*2,0,Math.PI*.48),mat('#292721'),[0,1.22,-.025]);hair.scale.set(1,.72,1);let fill=new THREE.PointLight(0xc1804d,5,8);fill.position.set(1,1,2);scene.add(fill);updatePerson();}else{scene.background=new THREE.Color('#22251f');let tunnel=new THREE.Mesh(new THREE.CylinderGeometry(2.5,3.8,11,12,1,true,0,Math.PI),new THREE.MeshStandardMaterial({color:'#48463a',side:THREE.BackSide,roughness:1}));tunnel.rotation.z=Math.PI/2;tunnel.position.set(0,.5,-2);scene.add(tunnel);let floor=new THREE.Mesh(new THREE.PlaneGeometry(30,18),new THREE.MeshStandardMaterial({color:'#24231c',roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.2;scene.add(floor);for(let i=0;i<20;i++){let b=new THREE.Mesh(new THREE.DodecahedronGeometry(Math.random()*.38+.12,0),new THREE.MeshStandardMaterial({color:['#514a3b','#393a31','#6d5943'][i%3],roughness:1}));b.position.set((Math.random()-.5)*12,-.95+Math.random()*.4,-6+Math.random()*7);b.rotation.set(Math.random(),Math.random(),Math.random());scene.add(b)}let glow=new THREE.PointLight(0xb97844,22,12);glow.position.set(-2,1.5,-1);scene.add(glow)}
const resize=()=>{if(!canvas.isConnected)return;let w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()};window.addEventListener('resize',resize,{passive:true});function animate(){if(!canvas.isConnected){renderer?.dispose();return}requestAnimationFrame(animate);if(creator&&personGroup)personGroup.rotation.y=Math.sin(Date.now()*.0004)*.12;renderer.render(scene,camera)}animate()}catch(e){console.warn('3D rendering unavailable',e)}}
renderCreator();
</script></body></html>
