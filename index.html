<script>
const TRAITS=['Aerial','Arboreal','Predatory','Foraging','Aquatic','Burrowing'];

const TRAIT_COLORS={Aerial:'#91a9c5',Arboreal:'#84a36c',Predatory:'#c57c5a',Foraging:'#b5a65f',Aquatic:'#6ea4a0',Burrowing:'#ae9069'};
const ACTIONS=[
 {title:'Leap for a moth',desc:'Launch through a shaft of sunlit air.',icon:'🪽',trait:'Aerial',gain:3,scene:'The first flight is barely a fall. A moth drifts above the fern tips, and for one bright second the whole green world opens beneath you.',log:'You took a brave little leap.'},
 {title:'Scramble up the fern',desc:'Find a higher, safer place to watch.',icon:'🌿',trait:'Arboreal',gain:3,scene:'The fern is a green cathedral. Each stem bends under your paws as you climb toward a crown of dripping leaves.',log:'You climbed toward the canopy.'},
 {title:'Pounce on a beetle',desc:'Practice the quickness of a hunter.',icon:'🦗',trait:'Predatory',gain:3,scene:'A beetle clicks through the leaf litter. Your body goes still, then springs. The chase leaves a new kind of confidence in your bones.',log:'You hunted a beetle.'},
 {title:'Nibble the tender shoots',desc:'Taste the green things after rain.',icon:'🍃',trait:'Foraging',gain:3,scene:'Rain beads on a carpet of clover. The shoots are crisp and sweet, and the earth smells like a promise.',diet:'Greens',log:'You fed on tender shoots.'},
 {title:'Wade into the stream',desc:'Follow a glint beneath the water.',icon:'💧',trait:'Aquatic',gain:3,scene:'Cold water curls around your ankles. Beneath the clear skin of the stream, small silver shapes flash and vanish.',diet:'River food',log:'You searched the stream for food.'},
 {title:'Dig a snug burrow',desc:'Make a home beneath the roots.',icon:'🕳️',trait:'Burrowing',gain:3,scene:'The soil is cool and soft below the old oak. You scratch out a chamber where the rain cannot reach.',log:'You made a deeper home.'},
 {title:'Gather fallen seeds',desc:'Store the forest’s small abundance.',icon:'🌰',trait:'Foraging',gain:2,diet:'Seeds',scene:'The wind has shaken a scatter of seeds loose. You gather them one by one, learning which husks crack and which are worth keeping.',log:'You gathered seeds for later.'},
 {title:'Chase a bright-winged bug',desc:'Run, spring, and follow the flutter.',icon:'🪲',trait:'Aerial',gain:2,scene:'A jewel-bright insect zigzags over the clearing. Your paws barely touch the ground as you race after it.',diet:'Insects',log:'You chased a winged insect.'},
 {title:'Gnaw a fallen nut',desc:'Crack the hard shell and feast.',icon:'🥜',trait:'Foraging',gain:2,diet:'Nuts',scene:'A hazelnut lies split in the moss. Its rich scent draws you in; the shell gives way beneath your sharp little teeth.',log:'You ate a fallen nut.'},
 {title:'Dart after a minnow',desc:'Try your luck in the shallows.',icon:'🐟',trait:'Aquatic',gain:2,diet:'Fish',scene:'A minnow flickers through the shallows. You plunge after it, startled by how good the cold feels against your fur.',log:'You caught a minnow.'},
 {title:'Stand your ground',desc:'Drive a fox kit from your nest.',icon:'🦊',trait:'Predatory',gain:2,scene:'A young fox noses too close to your nest. You bare your teeth and make yourself larger than you feel.',log:'You fought to defend your nest.'},
 {title:'Tuck into the earth',desc:'Wait out the storm underground.',icon:'🌧️',trait:'Burrowing',gain:2,scene:'Thunder rolls over the ridge. Belowground, the storm becomes a soft distant drum, and the dry earth holds you close.',log:'You sheltered below the roots.'}
];
const DREAMS=[
 {title:'A ladder made of moonlight',text:'In the hush between heartbeats, a pale ladder rises through a forest with no floor. Six little windows glow along its length.',opts:['Follow a drifting feather','Climb toward a green lantern','Chase the ember-eyed shadow','Gather the silver seeds','Dive through a blue doorway','Slip into the warm earth'],icons:['🪶','🌳','🔥','✨','🌊','🌒']},
 {title:'The river in the sky',text:'You dream of a river flowing overhead, full of stars. On its bank, six paths wait beneath unfamiliar constellations.',opts:['Ride the wind upstream','Reach for the highest bough','Follow the quick red tracks','Taste the starry fruit','Swim among falling stars','Find the hidden spring'],icons:['☄️','🌿','🐾','🍒','💦','🪨']},
 {title:'A seed the size of a world',text:'A vast seed opens, and inside it a tiny landscape turns slowly. Somewhere in the distance, a voice hums without words.',opts:['Float above the clouds','Nest in the crown of a tree','Run toward the distant call','Chew the bright new leaves','Follow the deep current','Make a home in the dark'],icons:['☁️','🌲','🐺','🌱','🐚','🪹']},
 {title:'The night garden',text:'Every flower in this garden is closed. A path of dew leads to six gates, each lit by a different kind of dawn.',opts:['Open the gate of feathers','Open the gate of leaves','Open the gate of teeth','Open the gate of seeds','Open the gate of tides','Open the gate of stone'],icons:['🪽','🍀','🐈','🌼','🐬','🦔']},
 {title:'The long falling',text:'You tumble gently through a dark full of quiet colors. Nothing is chasing you; nothing is waiting below.',opts:['Spread yourself to the air','Catch the bough that passes','Turn toward the distant movement','Reach for a floating berry','Drift into cool water','Curl into a pocket of soil'],icons:['🕊️','🍃','🦋','🍓','🫧','🌰']},
 {title:'A song with no singer',text:'A beautiful note moves through the ground and the leaves and the water. It seems to remember you, though you have never heard it.',opts:['Answer from the open sky','Answer from the canopy','Answer with a low growl','Answer with a rustle of leaves','Answer from beneath the water','Answer from your hidden den'],icons:['🎐','🪺','🐾','🌾','🐟','🕳️']},
 {title:'The turning seasons',text:'Winter and summer pass in a blink. In the center of the turning world, six small doors stand ajar.',opts:['Step through the door of wind','Step through the door of bark','Step through the door of hunger','Step through the door of plenty','Step through the door of rain','Step through the door of roots'],icons:['🍂','🪵','🦉','🌻','🌧️','🦡']},
 {title:'The quiet constellation',text:'You wake beneath a sky of enormous, close stars. One constellation breaks apart and scatters six faint trails across the dark.',opts:['Follow the trail that soars','Follow the trail that climbs','Follow the trail that hunts','Follow the trail that gathers','Follow the trail that flows','Follow the trail that burrows'],icons:['⭐','🌱','🐆','🌾','🐠','🦫']},
 {title:'The old hollow tree',text:'Inside the trunk, roots and branches meet in a room older than the forest. A little light waits at each of six passages.',opts:['Take the passage of open air','Take the passage of living wood','Take the passage with fresh tracks','Take the passage of ripe fruit','Take the passage of rainwater','Take the passage under roots'],icons:['🪶','🌳','🦊','🍇','💧','🐿️']},
 {title:'Before the first dawn',text:'A dark, gentle sea laps at a shore made of moss. Far away, something begins to glow. The dream asks nothing of you.',opts:['Drift toward the glow above','Climb the mossy shore','Follow a stirring shape','Taste what the tide left','Wade into the dark sea','Rest in a little hollow'],icons:['🌅','🌿','🦴','🫐','🌊','🪺']}
];
const APPEALS=[{name:'Moonlit markings',emoji:'✧',text:'A delicate pattern catches the eye.'},{name:'Velvet coat',emoji:'❋',text:'Soft, lustrous fur in a signature shade.'},{name:'Feathered crown',emoji:'♧',text:'A small crest that stirs in the breeze.'},{name:'Resonant call',emoji:'♫',text:'A clear song that carries through the grove.'},{name:'Fan-shaped tail',emoji:'〰',text:'A bright, expressive tail display.'},{name:'Iridescent scales',emoji:'✦',text:'A subtle shimmer along the shoulders.'}];
const SPECIES={Aerial:['Glimmerwing','Your descendants grow lighter, with broad gliding membranes and a taste for high places.'],Arboreal:['Canopykin','Your descendants become nimble branch-dwellers, at home in the leafy heights.'],Predatory:['Thornfang','Your descendants grow sharp, quick, and keen-eyed hunters.'],Foraging:['Cloverkin','Your descendants become resourceful gatherers with a broad, plant-rich diet.'],Aquatic:['Brookrunner','Your descendants take to stream and shore, sleek and sure in the water.'],Burrowing:['Rootkeeper','Your descendants become patient earth-dwellers, safe in a labyrinth of tunnels.']};
let state;
function freshState(){return {started:false,generation:1,actionsLeft:8,cycleActions:8,traits:Object.fromEntries(TRAITS.map(t=>[t,0])),diet:{},appeal:null,appealScore:0,species:'Mossmouse',history:[],dreamIndex:0,dreamMode:false,lastEvolution:null,sceneIndex:0}}
function load(){try{const s=JSON.parse(localStorage.getItem('littleBecoming'));return s?{...freshState(),...s}:freshState()}catch{return freshState()}}
state=load();
const main=document.getElementById('main'),side=document.getElementById('side');
function save(){localStorage.setItem('littleBecoming',JSON.stringify(state))}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function bestTrait(){return TRAITS.slice().sort((a,b)=>state.traits[b]-state.traits[a])[0]}
function topSix(){return TRAITS.slice().sort((a,b)=>state.traits[b]-state.traits[a])}
function currentScene(){if(!state.started)return 'intro';if(state.dreamMode)return 'dream';return state.scene||'action'}

function render(){document.getElementById('header-generation').textContent=`GEN ${String(state.generation).padStart(2,'0')}`;document.getElementById('header-phase').textContent=state.dreamMode?'The dreaming':state.started?'The green season':'A small beginning';renderMain();renderSide();save()}
function renderMain(){if(!state.started){main.innerHTML=renderIntro();return}if(state.lastEvolution){main.innerHTML=renderEvolution();return}if(state.dreamMode){main.innerHTML=renderDream();return}main.innerHTML=renderAction()}
function renderIntro(){return `<div class="eyebrow">A life in the undergrowth</div><h1>Small paws.<br>Many possible futures.</h1><p class="intro">You are a mouse at the edge of a vast, changing wood. Every leap, meal, climb, and choice nudges the shape of your descendants. Live a little. Dream a little. Become something new.</p><div class="art-card">${illustration('intro')}<div class="art-caption">The old forest is full of beginnings</div></div><section class="scene-wrap"><div class="scene-head"><div><h2>Every life leaves a trace.</h2><p class="scene-copy">Choose your first small act. Traits you practice grow; those you neglect gently fade. After eight actions, ten strange dreams will visit, then your species will evolve.</p></div><span class="phase-tag">Choose a beginning</span></div><div class="choices">${[0,1,2,3,4,5].map(i=>{const a=ACTIONS[i];return `<button class="choice" onclick="startGame(${i})"><span class="choice-icon">${a.icon}</span><span><span class="choice-title">${escapeHTML(a.title)}</span><span class="choice-desc">${escapeHTML(a.desc)}</span></span><span class="choice-arrow">›</span></button>`}).join('')}</div><p class="small-note">Your choices are saved in this browser.</p></section>`}
function renderAction(){const idx=(state.sceneIndex||0)%ACTIONS.length;const first=ACTIONS[idx];const desc=`${first.scene} There are many ways to make a life here.`;const opts=makeActionChoices();return `<div class="eyebrow">Season ${state.generation} · day ${state.cycleActions-state.actionsLeft+1}</div><h1>The forest is waking.</h1><p class="intro">${escapeHTML(desc)}</p><div class="art-card">${illustration('forest')}<div class="art-caption">Mosswood · early spring</div></div><section class="scene-wrap"><div class="scene-head"><div><h2>What will you do?</h2><p class="scene-copy">The hours are yours. Each small act leaves a mark.</p></div><span class="phase-tag">${state.actionsLeft} actions left</span></div><div class="choices">${opts.map((a,i)=>`<button class="choice" onclick="takeAction(${a.index})"><span class="choice-icon">${a.icon}</span><span><span class="choice-title">${escapeHTML(a.title)}</span><span class="choice-desc">${escapeHTML(a.desc)}</span></span><span class="choice-arrow">›</span></button>`).join('')}</div></section>`}
function makeActionChoices(){let start=(state.sceneIndex||0)*3% ACTIONS.length;let arr=[];for(let i=0;i<6;i++)arr.push({...ACTIONS[(start+i)%ACTIONS.length],index:(start+i)%ACTIONS.length});return arr}
function dreamChoices(){const options={Aerial:['Follow a drifting feather','Ride the upward current','Step onto the open sky','Reach for a falling star','Float beyond the treetops','Listen to the high wind'],Arboreal:['Climb toward a green lantern','Nest in the oldest bough','Follow the winding vines','Reach for a crown of leaves','Cross the bridge of branches','Rest in a hollow limb'],Predatory:['Chase the ember-eyed shadow','Follow the quick red tracks','Answer a distant growl','Watch the silent movement','Run with the night hunters','Guard the hidden clearing'],Foraging:['Gather the silver seeds','Taste the starry fruit','Follow a trail of berries','Open a flower of plenty','Collect the scattered husks','Find the sweetest leaves'],Aquatic:['Dive through a blue doorway','Swim among falling stars','Follow the deep current','Wade into a moonlit pool','Drift beneath the reeds','Listen to the river below'],Burrowing:['Slip into the warm earth','Find the hidden spring','Follow the tunnel of roots','Rest in a quiet hollow','Trace the path under stone','Curl beneath the garden']};return topSix().map(t=>({title:options[t][state.dreamIndex%options[t].length],icon:ICONS[t]}))}
function renderDream(){const d=DREAMS[state.dreamIndex],opts=dreamChoices();return `<div class="eyebrow">A quiet interval · ${state.dreamIndex+1} of 10</div><h1>${escapeHTML(d.title)}.</h1><p class="intro">${escapeHTML(d.text)}</p><div class="art-card">${illustration('dream')}<div class="art-caption">A dream, almost forgotten</div></div><section class="scene-wrap"><div class="scene-head"><div><h2>Where do you wander?</h2><p class="scene-copy">The dream holds still, waiting.</p></div><span class="phase-tag">Night ${state.dreamIndex+1}</span></div><div class="choices">${opts.map((o,i)=>`<button class="choice" onclick="dreamChoice(${i})"><span class="choice-icon">${o.icon}</span><span><span class="choice-title">${escapeHTML(o.title)}</span><span class="choice-desc">The path opens, then folds behind you.</span></span><span class="choice-arrow">›</span></button>`).join('')}</div></section>`}
function renderEvolution(){const e=state.lastEvolution;return `<div class="eyebrow">A new generation · season ${state.generation-1} complete</div><h1>Life finds a way.</h1><p class="intro">A season of small choices has become a shape. The dreams are gone by morning, but something of them remains.</p><div class="art-card">${illustration('evolution',e.trait==='Aerial'?'bird':'mouse')}<div class="art-caption">A new lineage takes its first breath</div></div><section class="scene-wrap"><div class="scene-head"><div><h2>${escapeHTML(e.name)}</h2><p class="scene-copy">${escapeHTML(e.description)}</p></div><span class="phase-tag">Evolution ${state.generation-1}</span></div><p class="scene-copy" style="margin-top:17px"><strong>Seasonal diet:</strong> ${escapeHTML(e.diet||'No particular preference yet.')}</p><div class="choice-result">Your instincts have shifted. Now choose a purely cosmetic trait that will make your lineage more alluring to potential mates. It changes no survival or evolution stats.</div><div class="choices">${APPEALS.map((a,i)=>`<button class="choice" onclick="chooseAppeal(${i})"><span class="choice-icon">${a.emoji}</span><span><span class="choice-title">${a.name}</span><span class="choice-desc">${a.text}</span></span><span class="choice-arrow">›</span></button>`).join('')}</div></section>`}
function renderSide(){const max=Math.max(24,...TRAITS.map(t=>state.traits[t]));const progress=state.started?state.dreamMode?state.dreamIndex/10:(8-state.actionsLeft)/8:0;const diet=Object.entries(state.diet).sort((a,b)=>b[1]-a[1]).slice(0,4);const log=state.history.slice(-4).reverse();side.innerHTML=`<div class="top-stat"><div class="top-stat-head"><span>Your lineage</span><span>✦ ${state.appealScore}</span></div><div class="top-stat-value">${escapeHTML(state.species)}</div><div class="top-stat-note">${state.appeal?`${escapeHTML(state.appeal)} · breeding appeal`: 'A little life, still becoming'}</div></div><div class="meter-card"><div class="card-title"><span>${state.dreamMode?'Dreams remaining':'Season clock'}</span><span class="timer-text">${state.dreamMode?`${10-state.dreamIndex} / 10`:state.started&&!state.lastEvolution?`${state.actionsLeft} / 8`:state.started?'Ready':'—'}</span></div><div class="timer-track"><div class="timer-fill" style="width:${Math.min(100,progress*100)}%"></div></div>${TRAITS.map(t=>`<div class="trait"><span class="trait-label">${ICONS[t]} ${t}</span><div class="trait-bar"><div class="trait-fill" style="width:${Math.min(100,state.traits[t]/max*100)}%;background:${TRAIT_COLORS[t]}"></div></div><span class="trait-value">${Math.round(state.traits[t])}</span></div>`).join('')}<div class="card-title" style="margin:17px 0 0">Dietary traces</div><div class="diet-list">${diet.length?diet.map(([d,n])=>`<span class="diet-chip">${escapeHTML(d)} · ${n}</span>`).join(''):'<span class="diet-chip">Not yet established</span>'}</div></div><div class="species-card"><div class="species-avatar">${state.lastEvolution?'🧬':'🐭'}</div><div><div class="species-label">Current species</div><div class="species-name">${escapeHTML(state.species)}</div></div></div><div class="log-card"><div class="card-title">Little traces <span>✎</span></div>${log.length?log.map(x=>`<div class="log-line">${escapeHTML(x)}</div>`).join(''):'<p class="notice">Your story will gather here, one small act at a time.</p>'}</div>`}
function startGame(firstAction=0){state.started=true;state.scene='action';state.actionsLeft=8;state.cycleActions=8;state.sceneIndex=0;takeAction(firstAction)}
function toast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),1650)}
function takeAction(index){const a=ACTIONS[index];if(!a||!state.started||state.dreamMode)return;for(const t of TRAITS){if(t===a.trait)state.traits[t]=Math.min(100,state.traits[t]+a.gain);else state.traits[t]=Math.max(0,state.traits[t]-.6)}if(a.diet)state.diet[a.diet]=(state.diet[a.diet]||0)+1;state.history.push(a.log);state.history=state.history.slice(-12);state.actionsLeft--;state.sceneIndex++;if(state.actionsLeft<=0){state.dreamMode=true;state.dreamIndex=0;state.dreamPoints=Object.fromEntries(TRAITS.map(t=>[t,0]));toast('The forest grows quiet.')}else toast(a.log);render()}
function dreamChoice(index){const order=topSix();const trait=order[index];state.dreamPoints=state.dreamPoints||Object.fromEntries(TRAITS.map(t=>[t,0]));state.dreamPoints[trait]=(state.dreamPoints[trait]||0)+10;state.dreamIndex++;if(state.dreamIndex>=10){resolveEvolution();return}toast('The dream slips away…');render()}
function resolveEvolution(){for(const t of TRAITS)state.traits[t]=Math.min(100,state.traits[t]+(state.dreamPoints?.[t]||0));const trait=bestTrait();const [name,description]=SPECIES[trait];const foods=Object.entries(state.diet).sort((a,b)=>b[1]-a[1]);const dietText=foods.length?foods.slice(0,3).map(([f,n])=>`${f.toLowerCase()}${n>1?' (often)':''}`).join(', '):'a little of whatever the forest offers';state.lastEvolution={trait,name,description,diet:dietText};state.species=name;state.generation++;state.dreamMode=false;state.dreamPoints={};state.history.push(`The old mouse line became ${name}.`);toast('The season has shaped a new species.');render()}
function chooseAppeal(index){const appeal=APPEALS[index];state.appeal=appeal.name;state.appealScore+=5;state.history.push(`Your lineage developed ${appeal.name.toLowerCase()}.`);state.lastEvolution=null;state.actionsLeft=8;state.cycleActions=8;state.dreamIndex=0;state.scene='action';render();window.scrollTo({top:0,behavior:'smooth'})}
render();
</script>
</body>
